name: Android Build

permissions:
  contents: write

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Google Services JSON
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

    - name: Create local.properties with secrets
      env:
        FIREBASE_SERVER_KEY: ${{ secrets.FIREBASE_SERVER_KEY }}
        ANALYTICS_PROPERTY_ID: ${{ secrets.ANALYTICS_PROPERTY_ID }}
        PREMIUM_SUBSCRIPTION_SKU: ${{ secrets.PREMIUM_SUBSCRIPTION_SKU }}
      run: |
        echo "firebase.server.key=$FIREBASE_SERVER_KEY" >> local.properties
        echo "analytics.property.id=$ANALYTICS_PROPERTY_ID" >> local.properties
        echo "premium.sku=$PREMIUM_SUBSCRIPTION_SKU" >> local.properties

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v6
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v6
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Aura Amour Release v${{ github.run_number }}
        body: |
          ### Aura Amour Automated Release
          
          This release contains the latest features and architectural improvements:
          - **Shared Notes & Wellness**: Premium grid-based notes and partner mood tracking.
          - **Shared Calendar**: Horizontal overview with native date/time pickers.
          - **Play Connect**: Real-time quiz comparison engine.
          - **Reliability**: Firestore "Upsert" logic with `SetOptions.merge()`.
          
          *Commit: ${{ github.sha }}*
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release-unsigned.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
